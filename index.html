<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meerstraat Boodschappen</title>
<meta name="theme-color" content="#f5f6fa">
<script>
/* Colour and mode chosen in Instellingen, applied before the page paints. Saved per device. */
window.THEME = {
  accents: { smaragd: ["Smaragd", "#059669", "#34d399"], oceaan: ["Oceaan", "#2563eb", "#60a5fa"], indigo: ["Indigo", "#4f46e5", "#818cf8"],
             framboos: ["Framboos", "#db2777", "#f472b6"], oranje: ["Oranje", "#ea580c", "#fb923c"], grafiet: ["Grafiet", "#334155", "#cbd5e1"] },
  get(k, d) { try { return localStorage.getItem(k) || d; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
  apply() {
    const r = document.documentElement, a = this.accents[this.get("accent", "indigo")] || this.accents.indigo, m = this.get("mode", "system");
    r.style.setProperty("--accent-l", a[1]); r.style.setProperty("--accent-d", a[2]);
    if (m === "light" || m === "dark") r.dataset.theme = m; else delete r.dataset.theme;
    const dark = m === "dark" || (m !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = dark ? "#0b0f17" : "#f5f6fa";
  }
};
THEME.apply();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => THEME.apply());
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boodschappen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow">Meerstraat</div>
      <h1 id="title">Boodschappen</h1>
    </div>
    <button type="button" class="me" id="me-btn" aria-expanded="false" hidden></button>
  </header>
  <div id="whopanel" hidden></div>
  <div class="status" id="status" hidden></div>
  <main id="view"><div class="empty"><b>Laden…</b></div></main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Weergaven" hidden>
  <div class="in" role="tablist">
    <button type="button" role="tab" id="tab-list" data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Deze week<span class="badge" id="badge" hidden></span></button>
    <button type="button" role="tab" id="tab-menu" data-tab="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v9M4 2v6a3 3 0 0 0 6 0V2M7 11v11"/><path d="M17 22V2c-2.2 1.2-3.5 3.8-3.5 7v4H17"/></svg>Weekmenu</button>
    <button type="button" role="tab" id="tab-staples" data-tab="staples"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Vaste items</button>
    <button type="button" role="tab" id="tab-history" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Historiek</button>
    <button type="button" role="tab" id="tab-more" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Meer</button>
  </div>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
